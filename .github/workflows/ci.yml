
name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compile Code Base
        run: mvn clean compile

      - name: Run Automated Test Suites
        run: mvn test

      - name: Package Executable Distribution
        run: mvn package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-jar
          path: target/*.jar
          retention-days: 5

  deploy-production:
    needs: build-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-ready-jar
          path: deployment-artifact

      - name: Automatic Production Deployment
        run: |
          echo "Build and tests passed."
          echo "Production deployment started automatically."
          echo "Artifact contents:"
          ls -lh deployment-artifact/
          echo "Lab 8 CD pipeline completed successfully."
